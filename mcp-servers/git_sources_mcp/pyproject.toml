[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git_sources_mcp"
version = "0.1.0"
description = "Scoped, read-only MCP access to allowlisted upstream/Salsa git repos"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
